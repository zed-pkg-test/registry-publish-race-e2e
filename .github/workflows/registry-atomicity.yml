name: Registry publication atomicity

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  atomicity-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Compile deterministic model and tests
        run: python3 -m compileall -q src tests scripts
      - name: Run registry publication and recovery invariants
        env:
          PYTHONPATH: .
        run: python3 -m unittest discover -s tests -v
      - name: Verify repository metadata contract
        run: python3 scripts/verify.py
